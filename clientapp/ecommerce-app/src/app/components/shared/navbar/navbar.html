<nav class="navbar" aria-label="Main navigation">
  <a class="brand" routerLink="/products" aria-label="Store home">Store</a>

  <div class="nav-links">
    @for (route of routes; track route.path) {
    <a [routerLink]="route.path" routerLinkActive="active">{{ route.label }}</a>
    }
  </div>

  <a class="cart-link" routerLink="/cart" [attr.aria-label]="'Shopping cart, ' + cartCount + ' items'">
    <fa-icon [icon]="faCartShopping"></fa-icon>
    @if (cartCount > 0) {
    <span class="cart-count">{{ cartCount }}</span>
    }
  </a>

  <div class="account-links" aria-label="Account">
    @if (authService.currentUser$ | async; as user) {
    <span class="account-user" [title]="user.email">
      {{ user.username || user.email }}
    </span>
    <button type="button" class="sign-out-button" (click)="signOut()">Sign out</button>
    } @else {
      @for (authRoute of authRoutes; track authRoute.path) {
      <a [routerLink]="authRoute.path" [class.login-label]="authRoute.path === '/login'"
        [class.signup-label]="authRoute.path === '/register'">
        {{ authRoute.label }}
      </a>
      }
    }
  </div>
</nav>
